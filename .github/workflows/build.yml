name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # ESLint 10 uses Node util.styleText, and jsdom 30 requires Node 22+.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint site
        run: npm run lint

      - name: Test site
        run: npm test

      - name: Build site
        run: npm run build
        env:
          NEXT_PUBLIC_BRANCH: main
