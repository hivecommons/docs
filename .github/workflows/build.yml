name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatched by meeting-recordings-refresh.yml: PRs it opens with GITHUB_TOKEN
  # never get pull_request runs, so it triggers this workflow on the PR branch
  # instead (#335, #337).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ESLint 10 uses Node util.styleText, and jsdom 30 requires Node 22+.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check bot deploy-preview ignore coverage
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npx tsx scripts/check-deploy-preview-ignore.ts

      # Lint and unit tests are gated by typecheck.yml and vitest.yml
      # respectively (vitest.yml additionally enforces coverage
      # thresholds); running them again here just duplicates those jobs.
      - name: Build site
        run: npm run build
        env:
          NEXT_PUBLIC_BRANCH: main
