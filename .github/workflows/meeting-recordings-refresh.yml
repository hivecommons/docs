name: Refresh meeting recordings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

env:
  NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.11.1'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/update-meeting-recordings.ts
      - name: Commit recording feed snapshot
        uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6.0.1
        with:
          commit_message: 'docs: refresh community meeting recordings'
          file_pattern: data/meeting-recordings.json
      - name: Trigger Netlify rebuild
        if: env.NETLIFY_BUILD_HOOK_URL != ''
        run: curl --fail -sS -X POST "$NETLIFY_BUILD_HOOK_URL"
