name: Refresh meeting recordings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On `schedule`, github.sha is main as of trigger time. If the job sits in
          # the runner queue (run 37370568225 waited 70 min) that base is stale and
          # the auto-commit push below is rejected non-fast-forward. Checking out the
          # branch by name fetches the live tip at job start instead.
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/update-meeting-recordings.ts
      - name: Commit recording feed snapshot
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'docs: refresh community meeting recordings'
          file_pattern: data/meeting-recordings.json
      - name: Trigger Netlify rebuild
        if: env.NETLIFY_BUILD_HOOK_URL != ''
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail -sS -X POST "$NETLIFY_BUILD_HOOK_URL"
