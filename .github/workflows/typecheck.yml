name: TypeScript & Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Dispatched by meeting-recordings-refresh.yml: PRs it opens with GITHUB_TOKEN
  # never get pull_request runs, so it triggers this workflow on the PR branch
  # instead (#335, #337).
  workflow_dispatch:

permissions: read-all # default read; writes scoped to job below

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: TypeScript & ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ESLint 10 uses Node util.styleText; align with build.yml/vitest.yml.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Pre-install typos (retrying, cached) so a transient release-CDN error
      # does not fail the check; the Typos action skips its single-shot download
      # when $HOME/bin/typos is already executable (#686).
      - name: Cache typos
        id: typos-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/bin/typos
          key: typos-v1.52.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install typos
        if: steps.typos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            "https://github.com/crate-ci/typos/releases/download/v1.52.0/typos-v1.52.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/bin" ./typos
          chmod +x "$HOME/bin/typos"

      # Spell check; config and allow-list in _typos.toml (#455).
      - name: Typos
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
