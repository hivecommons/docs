name: Bug Report
description: Create a report to help us improve
title: "bug: "
labels:
  - kind/bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before opening a new issue, look for an overlapping issue that
        you could contribute to.

        Here is how you can help us serve you better:

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of the bug.
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The docs.hivecommons.dev page where you saw the problem, if any.
      placeholder: https://docs.hivecommons.dev/...

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: For rendering, search or navigation problems.
      placeholder: e.g. Firefox 131 on macOS 15

  - type: textarea
    id: reproducing
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Want to contribute?
      options:
        - label: I would like to work on this issue.
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here.
        If you are following some instructions, please give a pointer to them.
