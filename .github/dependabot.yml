version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react and react-dom must be the exact same version or react-dom
      # throws at import time; keep the whole family in one PR (issue #87).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # TypeScript 7 (native compiler) breaks tsc on sibling repos (pluk,
      # promptargs, rationguard); land TS majors via a deliberate migration PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "clubanderson"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
